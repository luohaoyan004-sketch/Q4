<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>题型1 手绘边界有限差分</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><header class="topbar"><a class="btn" href="index.html" style="text-decoration:none">← 返回主页</a><div><h1>题型 1：手绘边界有限差分</h1><div class="subtitle">水平/竖直边经过的网格点自动成为边界点；斜边只保留端点。</div></div></header>
<section><div class="layout"><aside class="card panel"><div class="control-group"><h3>1 · 生成网格</h3><div class="field-row"><div><label>x 方向点数</label><input id="nx" type="number" min="3" max="12" value="5"></div><div><label>y 方向点数</label><input id="ny" type="number" min="3" max="12" value="4"></div></div><div class="field-row one"><div><label>源项 f(x,y)</label><input id="source" value="0"></div></div><button class="btn dark" id="newGrid">生成新网格</button><div class="mini-note">可输入：0、x+y、sin(x*y)、x^2+y 等。</div></div><div class="control-group"><h3>2 · 操作步骤</h3><div class="segmented"><button class="btn mode-btn active" data-mode="draw">① 画边界</button><button class="btn mode-btn" data-mode="set">② 设置边界值</button><button class="btn mode-btn" data-mode="solve">③ 点选未知点求解</button></div></div><div class="control-group"><h3>3 · 自动求解</h3><div class="field-row one"><div><label>自动迭代次数</label><input id="iterations" type="number" min="1" value="60"></div></div><div class="field-row one"><div><label>求解方法</label><select id="method"><option value="gauss">Gauss-Seidel</option><option value="jacobi">Jacobi</option><option value="sor">SOR</option></select></div></div><div class="field-row one" id="omegaWrap" style="display:none"><div><label>SOR 松弛因子 ω</label><input id="omega" type="number" min="0.1" max="1.95" step="0.05" value="1.2"></div></div><div class="segmented"><button class="btn dark" id="autoSolve">自动求解</button></div></div><div class="control-group"><h3>4 · 重置</h3><div class="segmented"><button class="btn warn" id="resetAll">全部重置</button></div></div></aside><main class="card main-canvas"><div class="canvas-header"><div><h3>手绘边界画布</h3><div class="subtitle" id="canvasTip">当前步骤：画边界。请按顺序点击网格点，最后点击第一个点闭合。</div></div><div class="hint" id="modeHint">画边界</div></div><div class="visual-stack"><div class="sub-card"><div class="sub-card-title"><div><h4>点阵网格</h4><p>黑色粗线是边界；水平/竖直边经过的网格点也会成为边界点；斜边只保留端点。</p></div></div><div class="grid-canvas-wrap"><svg id="gridSvg" viewBox="0 0 900 460"></svg></div><div class="legend"><div class="legend-item"><span class="swatch" style="background:#111827"></span> 边界点</div><div class="legend-item"><span class="swatch" style="background:#fff;border:2px solid #111827"></span> 内部未知点</div><div class="legend-item"><span class="swatch" style="background:#d1fae5"></span> 已求值</div><div class="legend-item"><span class="swatch" style="background:#dbeafe"></span> 邻点</div><div class="legend-item"><span class="swatch" style="background:#f1f5f9"></span> 外部区域</div></div></div><div class="sub-card"><div class="sub-card-title"><div><h4>分块热力图</h4><p>每求出一个点，对应位置会自动生成颜色块。</p></div></div><div class="heat-map"><canvas id="heatCanvas" width="900" height="300"></canvas></div></div></div></main><aside class="card formula-card"><h3>公式卡片</h3><div class="pretty-box"><div class="pretty-label">Rule</div><div id="ruleBox"></div></div><div class="pretty-box"><div class="pretty-label">Substitution</div><div id="subBox"></div></div></aside></div></section></div>
<script>
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));const state={nx:5,ny:4,mode:"draw",vertices:[],closed:false,boundarySet:new Set,activeSet:new Set,interiorSet:new Set,outsideSet:new Set,values:new Map,solvedSet:new Set,selected:null,neighbors:[],lastCalc:null};const svg=$("#gridSvg"),canvas=$("#heatCanvas"),ctx=canvas.getContext("2d");const key=(i,j)=>`${i},${j}`,parseKey=k=>k.split(",").map(Number),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function fmt(n,d=4){if(n==null||Number.isNaN(n)||!Number.isFinite(n))return"?";return Number(n).toFixed(d).replace(/\.?0+$/,'')}function compileExpr(expr,names){const safe=String(expr||"0").replace(/\bpi\b/gi,"Math.PI").replace(/\be\b/g,"Math.E").replace(/\bsin\b/g,"Math.sin").replace(/\bcos\b/g,"Math.cos").replace(/\btan\b/g,"Math.tan").replace(/\bexp\b/g,"Math.exp").replace(/\blog\b/g,"Math.log").replace(/\bsqrt\b/g,"Math.sqrt").replace(/\babs\b/g,"Math.abs").replace(/\bpow\b/g,"Math.pow").replace(/\^/g,"**");try{return new Function(...names,`"use strict"; return (${safe});`)}catch{return()=>0}}function evalExpr(expr,vars){try{const fn=compileExpr(expr,Object.keys(vars)),v=fn(...Object.values(vars));return Number.isFinite(v)?Number(v):0}catch{return 0}}function px(i){const p=70,w=900-p*2;return p+i/state.nx*w}function py(j){const p=55,h=460-p*2;return 460-p-j/state.ny*h}const coord=(i,j)=>({x:i,y:j});function updateMethodUI(){$("#omegaWrap").style.display=$("#method").value==="sor"?"grid":"none"}function getMethodName(){const v=$("#method").value;return v==="jacobi"?"Jacobi":v==="sor"?"SOR":"Gauss-Seidel"}function updateStepText(){const m=state.mode;if(m==="draw"){$("#modeHint").textContent="画边界";$("#canvasTip").textContent="当前步骤：画边界。请按顺序点击网格点，最后点击第一个点闭合。"}if(m==="set"){$("#modeHint").textContent="设置边界值";$("#canvasTip").textContent="当前步骤：设置边界值。请点击黑色边界点，然后手动输入该点的边界值。"}if(m==="solve"){$("#modeHint").textContent="点选求解";$("#canvasTip").textContent="当前步骤：点选未知点求解。请点击白色空心点，系统会自动代入四邻点计算。"}}function updateStatus(){}function setMode(mode){state.mode=mode;$$('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));updateStepText();render()}function pointInPolygon(x,y,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i].i,yi=poly[i].j,xj=poly[j].i,yj=poly[j].j;const hit=((yi>y)!==(yj>y))&&(x<((xj-xi)*(y-yi))/((yj-yi)||1e-12)+xi);if(hit)inside=!inside}return inside}function rebuildSets(){state.boundarySet.clear();state.activeSet.clear();state.interiorSet.clear();state.outsideSet.clear();function add(i,j){const k=key(i,j);state.boundarySet.add(k);state.activeSet.add(k)}for(const v of state.vertices)add(v.i,v.j);if(state.vertices.length>=2){const seg=[];for(let a=0;a<state.vertices.length-1;a++)seg.push([state.vertices[a],state.vertices[a+1]]);if(state.closed)seg.push([state.vertices[state.vertices.length-1],state.vertices[0]]);for(const[p0,p1]of seg){if(p0.i===p1.i){for(let j=Math.min(p0.j,p1.j);j<=Math.max(p0.j,p1.j);j++)add(p0.i,j)}else if(p0.j===p1.j){for(let i=Math.min(p0.i,p1.i);i<=Math.max(p0.i,p1.i);i++)add(i,p0.j)}else{add(p0.i,p0.j);add(p1.i,p1.j)}}}if(!state.closed){for(let j=0;j<=state.ny;j++)for(let i=0;i<=state.nx;i++){const k=key(i,j);if(!state.boundarySet.has(k))state.outsideSet.add(k)}return}for(let j=0;j<=state.ny;j++)for(let i=0;i<=state.nx;i++){const k=key(i,j);if(state.boundarySet.has(k))continue;if(pointInPolygon(i,j,state.vertices)){state.interiorSet.add(k);state.activeSet.add(k);if(!state.values.has(k))state.values.set(k,0)}else state.outsideSet.add(k)}}function handlePointClick(i,j){if(state.mode==="draw")handleDrawClick(i,j);if(state.mode==="set")handleSetClick(i,j);if(state.mode==="solve")handleSolveClick(i,j)}function handleDrawClick(i,j){if(state.closed)return;if(state.vertices.length>=3){const f=state.vertices[0];if(f.i===i&&f.j===j){state.closed=true;rebuildSets();render();return}}const last=state.vertices[state.vertices.length-1];if(last&&last.i===i&&last.j===j)return;state.vertices.push({i,j});rebuildSets();render()}function handleSetClick(i,j){const k=key(i,j);if(!state.boundarySet.has(k))return;const old=state.values.has(k)?state.values.get(k):"";const input=prompt(`请输入边界点 (${i}, ${j}) 的边界值`,old);if(input===null)return;const value=evalExpr(input,coord(i,j));state.values.set(k,value);state.solvedSet.add(k);state.selected={i,j};state.neighbors=[];state.lastCalc={type:"boundary",i,j,...coord(i,j),value};render()}function handleSolveClick(i,j){const k=key(i,j);if(!state.interiorSet.has(k))return;calculateInteriorPoint(i,j,true);render()}function nearestBoundaryValue(i,j){let best=null,bestD=Infinity;for(const k of state.boundarySet){if(!state.values.has(k))continue;const[bi,bj]=parseKey(k),d=(bi-i)**2+(bj-j)**2;if(d<bestD){bestD=d;best=state.values.get(k)}}return best===null?0:best}function getNeighborValue(i,j){const k=key(i,j);return state.values.has(k)?state.values.get(k):nearestBoundaryValue(i,j)}function getNeighborInfo(i,j){return[{name:"左",i:i-1,j},{name:"右",i:i+1,j},{name:"上",i,j:j+1},{name:"下",i,j:j-1}].map(d=>{const k=key(d.i,d.j);return {...d,value:state.values.has(k)?state.values.get(k):nearestBoundaryValue(d.i,d.j)}})}function calculateInteriorPoint(i,j,mark=false){const k=key(i,j),{x,y}=coord(i,j),fVal=evalExpr($("#source").value,{x,y});const n=getNeighborInfo(i,j),L=n.find(a=>a.name==="左").value,R=n.find(a=>a.name==="右").value,U=n.find(a=>a.name==="上").value,D=n.find(a=>a.name==="下").value,value=(L+R+U+D-fVal)/4;state.values.set(k,value);state.solvedSet.add(k);if(mark){state.selected={i,j};state.neighbors=n.map(a=>({i:a.i,j:a.j}));state.lastCalc={type:"interior",method:"单点代入",i,j,x,y,L,R,U,D,fVal,value}}return value}function jacobiStep(){const old=new Map(state.values),neu=new Map(state.values);for(const k of state.interiorSet){const[i,j]=parseKey(k),{x,y}=coord(i,j),fVal=evalExpr($("#source").value,{x,y});const ov=(a,b)=>old.has(key(a,b))?old.get(key(a,b)):nearestBoundaryValue(a,b);neu.set(k,(ov(i-1,j)+ov(i+1,j)+ov(i,j+1)+ov(i,j-1)-fVal)/4);state.solvedSet.add(k)}state.values=neu}function gaussStep(){for(const k of state.interiorSet){const[i,j]=parseKey(k),{x,y}=coord(i,j),fVal=evalExpr($("#source").value,{x,y});state.values.set(k,(getNeighborValue(i-1,j)+getNeighborValue(i+1,j)+getNeighborValue(i,j+1)+getNeighborValue(i,j-1)-fVal)/4);state.solvedSet.add(k)}}function sorStep(w){for(const k of state.interiorSet){const[i,j]=parseKey(k),{x,y}=coord(i,j),fVal=evalExpr($("#source").value,{x,y}),old=state.values.get(k)||0;const gs=(getNeighborValue(i-1,j)+getNeighborValue(i+1,j)+getNeighborValue(i,j+1)+getNeighborValue(i,j-1)-fVal)/4;state.values.set(k,old+w*(gs-old));state.solvedSet.add(k)}}function autoSolve(){const n=Math.max(1,+$("#iterations").value||60),m=$("#method").value,w=+$("#omega").value||1.2;for(let s=0;s<n;s++){if(m==="jacobi")jacobiStep();else if(m==="sor")sorStep(w);else gaussStep()}const first=Array.from(state.interiorSet)[0];if(first){const[i,j]=parseKey(first);calculateInteriorPoint(i,j,true);state.lastCalc.method=getMethodName()}render()}function newGrid(){state.nx=clamp(+$("#nx").value||5,3,12);state.ny=clamp(+$("#ny").value||4,3,12);state.vertices=[];state.closed=false;state.boundarySet.clear();state.activeSet.clear();state.interiorSet.clear();state.outsideSet.clear();state.values.clear();state.solvedSet.clear();state.selected=null;state.neighbors=[];state.lastCalc=null;rebuildSets();setMode("draw");render()}function resetAll(){newGrid()}function render(){renderGrid();renderHeatMap();renderFormula()}function addSvgText(x,y,text,o={}){const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("text-anchor",o.anchor||"middle");t.setAttribute("fill",o.fill||"#111827");t.setAttribute("font-size",o.size||"12");t.setAttribute("font-weight",o.weight||"900");t.textContent=text;svg.appendChild(t)}function addBoundaryValueLabel(i,j,value){const label=fmt(value,2),width=Math.max(32,label.length*8+14),height=20;let x=clamp(px(i)+12,4,900-width-4),y=clamp(py(j)-28,4,460-height-4);const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("class","boundary-value-label");const r=document.createElementNS("http://www.w3.org/2000/svg","rect");r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",width);r.setAttribute("height",height);const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",x+width/2);t.setAttribute("y",y+14);t.setAttribute("text-anchor","middle");t.textContent=label;g.appendChild(r);g.appendChild(t);svg.appendChild(g)}function renderGrid(){svg.innerHTML="";for(let i=0;i<=state.nx;i++){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",px(i));l.setAttribute("y1",py(0));l.setAttribute("x2",px(i));l.setAttribute("y2",py(state.ny));l.setAttribute("class",i===0?"axis-line":"grid-line");svg.appendChild(l)}for(let j=0;j<=state.ny;j++){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",px(0));l.setAttribute("y1",py(j));l.setAttribute("x2",px(state.nx));l.setAttribute("y2",py(j));l.setAttribute("class",j===0?"axis-line":"grid-line");svg.appendChild(l)}for(let i=0;i<=state.nx;i++)addSvgText(px(i),py(0)+31,i,{fill:"#64748b"});for(let j=0;j<=state.ny;j++)addSvgText(px(0)-26,py(j)+4,j,{fill:"#64748b"});if(state.selected&&state.neighbors.length)for(const nb of state.neighbors){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",px(state.selected.i));l.setAttribute("y1",py(state.selected.j));l.setAttribute("x2",px(nb.i));l.setAttribute("y2",py(nb.j));l.setAttribute("class","dependency-line");svg.appendChild(l)}if(state.vertices.length>=2){const pts=state.vertices.map(v=>`${px(v.i)},${py(v.j)}`).join(" ");const poly=document.createElementNS("http://www.w3.org/2000/svg",state.closed?"polygon":"polyline");poly.setAttribute("points",pts);poly.setAttribute("class",state.closed?"boundary-line":"preview-line");svg.appendChild(poly)}for(let j=0;j<=state.ny;j++)for(let i=0;i<=state.nx;i++){const k=key(i,j),g=document.createElementNS("http://www.w3.org/2000/svg","g");let cls="candidate";if(state.closed){if(state.boundarySet.has(k))cls="boundary";else if(state.interiorSet.has(k))cls=state.solvedSet.has(k)?"solved":"interior";else cls="outside"}else cls=state.boundarySet.has(k)?"vertex":"candidate";if(state.selected&&state.selected.i===i&&state.selected.j===j)cls+=" selected";else if(state.neighbors.some(n=>n.i===i&&n.j===j))cls+=" neighbor";g.setAttribute("class","node "+cls);const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",px(i));c.setAttribute("cy",py(j));c.setAttribute("r",state.closed?15:10);const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",px(i));t.setAttribute("y",py(j)+4);t.setAttribute("text-anchor","middle");if(state.interiorSet.has(k)&&state.solvedSet.has(k))t.textContent=fmt(state.values.get(k),1);g.appendChild(c);g.appendChild(t);g.addEventListener("click",()=>handlePointClick(i,j));svg.appendChild(g)}for(const k of state.boundarySet)if(state.values.has(k)){const[i,j]=parseKey(k);addBoundaryValueLabel(i,j,state.values.get(k))}}function colorForValue(v,min,max){if(!Number.isFinite(v))return[226,232,240];if(Math.abs(max-min)<1e-12)return[248,250,252];const mid=(max+min)/2,scale=Math.max(Math.abs(max-mid),Math.abs(min-mid))||1,z=clamp((v-mid)/scale,-1,1);return z>0?[255,Math.round(245-105*z),Math.round(230-175*z)]:z<0?[Math.round(230+120*z),Math.round(240+75*z),255]:[248,250,252]}function renderHeatMap(){const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.fillStyle="#f8fafc";ctx.fillRect(0,0,W,H);const vals=Array.from(state.values.values()).filter(Number.isFinite),min=vals.length?Math.min(...vals):0,max=vals.length?Math.max(...vals):1,pad=28,cw=(W-pad*2)/state.nx,ch=(H-pad*2)/state.ny,cx=i=>pad+i*cw,cy=j=>H-pad-j*ch;for(let j=0;j<state.ny;j++)for(let i=0;i<state.nx;i++){ctx.fillStyle="rgba(226,232,240,.42)";ctx.fillRect(cx(i),cy(j+1),cw,ch)}for(const k of state.activeSet){const[i,j]=parseKey(k),ok=(state.boundarySet.has(k)&&state.values.has(k))||(state.interiorSet.has(k)&&state.solvedSet.has(k));if(!ok)continue;const[r,g,b]=colorForValue(state.values.get(k),min,max),x0=cx(Math.max(0,i-.5)),y0=cy(Math.min(state.ny,j+.5)),x1=cx(Math.min(state.nx,i+.5)),y1=cy(Math.max(0,j-.5));ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(x0,y0,x1-x0,y1-y0)}ctx.save();ctx.strokeStyle="rgba(255,255,255,.86)";ctx.lineWidth=1;for(let i=0;i<=state.nx;i++){ctx.beginPath();ctx.moveTo(cx(i),pad);ctx.lineTo(cx(i),H-pad);ctx.stroke()}for(let j=0;j<=state.ny;j++){ctx.beginPath();ctx.moveTo(pad,cy(j));ctx.lineTo(W-pad,cy(j));ctx.stroke()}ctx.restore();if(state.vertices.length>=2){ctx.save();ctx.strokeStyle="#111827";ctx.lineWidth=4;ctx.lineJoin="round";ctx.lineCap="round";ctx.beginPath();state.vertices.forEach((v,idx)=>{const x=cx(v.i),y=cy(v.j);idx===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});if(state.closed)ctx.closePath();ctx.stroke();ctx.restore()}}function mathVar(base,sub=""){return sub?`<span class="math-i">${base}</span><span class="math-sub">${sub}</span>`:`<span class="math-i">${base}</span>`}function frac(top,bottom){return`<span class="frac"><span class="top">${top}</span><span class="bottom">${bottom}</span></span>`}function renderRuleBox(){const source=($("#source").value||"0").trim(),lap=source==="0";$("#ruleBox").innerHTML=`<div class="eq-wrap"><div class="eq-head"><span class="eq-chip">${lap?"Laplace":"Poisson"}</span><span class="eq-chip gray">五点差分格式</span></div><div class="equation"><div class="math-line">${mathVar("u","c")} = ${frac(`${mathVar("u","L")} + ${mathVar("u","R")} + ${mathVar("u","U")} + ${mathVar("u","D")}${lap?"":" - f(i,j)"}`,'4')}</div></div><div class="formula-note">${lap?"当源项 <b>f(x,y)=0</b> 时，中心点等于四邻点平均值。":`当前源项为：<b>${source}</b>。`}</div></div>`}function renderSubBox(){if(!state.lastCalc){$("#subBox").innerHTML='<div class="empty-sub">—</div>';return}const c=state.lastCalc;if(c.type==="boundary"){$("#subBox").innerHTML=`<div class="eq-wrap"><div class="eq-head"><span class="eq-chip gray">边界条件</span></div><div class="equation"><div class="equation-steps"><div class="eq-row"><div class="eq-left">u(${c.i}, ${c.j})</div><div class="eq-sign">=</div><div class="eq-right">${fmt(c.value,6)}</div></div></div></div><div class="formula-note">该点是边界点，数值直接给定。</div></div>`;return}const num=c.L+c.R+c.U+c.D-c.fVal;$("#subBox").innerHTML=`<div class="eq-wrap"><div class="eq-head"><span class="eq-chip">${c.method||"单点代入"}</span><span class="eq-chip gray">点 (${c.i}, ${c.j})</span></div><div class="equation"><div class="equation-steps"><div class="eq-row"><div class="eq-left">u(${c.i}, ${c.j})</div><div class="eq-sign">=</div><div class="eq-right">${frac(`${fmt(c.L,4)} + ${fmt(c.R,4)} + ${fmt(c.U,4)} + ${fmt(c.D,4)} - ${fmt(c.fVal,4)}`,'4')}</div></div><div class="eq-row"><div class="eq-left"></div><div class="eq-sign">=</div><div class="eq-right">${frac(fmt(num,6),'4')}</div></div><div class="eq-row"><div class="eq-left"></div><div class="eq-sign">=</div><div class="eq-right">${fmt(c.value,6)}</div></div></div></div><table class="math-table"><tr><td>左邻点</td><td>${fmt(c.L,6)}</td></tr><tr><td>右邻点</td><td>${fmt(c.R,6)}</td></tr><tr><td>上邻点</td><td>${fmt(c.U,6)}</td></tr><tr><td>下邻点</td><td>${fmt(c.D,6)}</td></tr><tr><td>源项 f</td><td>${fmt(c.fVal,6)}</td></tr><tr><td>结果</td><td>${fmt(c.value,6)}</td></tr></table></div>`}function renderFormula(){renderRuleBox();renderSubBox()}$$('.mode-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$("#newGrid").addEventListener("click",newGrid);$("#autoSolve").addEventListener("click",autoSolve);$("#resetAll").addEventListener("click",resetAll);$("#method").addEventListener("change",()=>{updateMethodUI();render()});$("#source").addEventListener("input",renderFormula);updateMethodUI();newGrid();
</script></body></html>
